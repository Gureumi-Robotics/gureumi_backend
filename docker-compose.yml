services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: gureumi
      POSTGRES_PASSWORD: gureumi
      POSTGRES_DB: gureumi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro


volumes:
  db-data:
